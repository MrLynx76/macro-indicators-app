<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Indicators Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #333;
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 16px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .login-box button:hover {
            background: #0056b3;
        }

        .dashboard {
            display: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 28px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .indicator-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }

        .indicator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .indicator-name {
            font-weight: bold;
            font-size: 16px;
        }

        .status-badge {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-badge.green { background: #28a745; }
        .status-badge.yellow { background: #ffc107; }
        .status-badge.red { background: #dc3545; }
        .status-badge.gray { background: #6c757d; }

        .current-value {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
            color: #fff;
        }

        .last-date {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }

        .last-three {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .last-three-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }

        .last-three-item:last-child {
            border-bottom: none;
        }

        .chart-container {
            position: relative;
            height: 200px;
            margin-top: 15px;
        }

        .thresholds-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .thresholds-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .thresholds-content h2 {
            margin-bottom: 20px;
        }

        .threshold-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .threshold-item:last-child {
            border-bottom: none;
        }

        .threshold-label {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .threshold-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .threshold-inputs input {
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }

        .error {
            color: #dc3545;
            padding: 10px;
            background: #2a1a1a;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen" style="display:none">
        <div class="login-box">
            <h1>Macro Indicators</h1>
            <input type="password" id="passwordInput" placeholder="Contraseña" />
            <button onclick="login()">Entrar</button>
        </div>
    </div>

    <div class="dashboard" id="dashboard" style="display:block">
        <div class="container">
            <div class="header">
                <h1>Macro Indicators Monitor</h1>
                <div class="controls">
                    <button onclick="fetchData()">Actualizar</button>
                    <button class="secondary" onclick="openThresholds()">Umbrales</button>
                </div>
            </div>

            <div id="errorMessage"></div>
            <div id="indicatorsContainer" class="indicators-grid">
                <div class="loading">Cargando datos...</div>
            </div>
        </div>
    </div>

    <div class="thresholds-modal" id="thresholdsModal">
        <div class="thresholds-content">
            <h2>Configurar Umbrales</h2>
            <div id="thresholdsForm"></div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="saveThresholds()">Guardar</button>
                <button class="secondary" onclick="closeThresholds()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let password = null;
        let currentData = null;
        let charts = {};

        function login() {
            const input = document.getElementById('passwordInput');
            password = input.value;

            if (!password) {
                alert('Ingresa contraseña');
                return;
            }

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            fetchData();
        }

        function logout() {
            password = null;
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/data', {
                    headers: {
                        'X-Password': password
                    }
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                if (!response.ok) {
                    const txt = await response.text();
                    throw new Error(`El servidor respondió ${response.status}. ${txt.slice(0, 150)}`);
                }

                currentData = await response.json();
                renderIndicators();
                document.getElementById('errorMessage').innerHTML = '';
            } catch (error) {
                document.getElementById('errorMessage').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        // Indicadores en dólares. Formato US: miles con coma,
        // decimales con punto, símbolo $ separado por un espacio.
        const CURRENCY_INDICATORS = ['WRESBAL', 'WTREGEN', 'HYG'];

        function formatUS(value, decimals) {
            return value.toLocaleString('en-US', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
        }

        function formatValue(code, value) {
            if (value === null || value === undefined) return 'N/A';

            // Indicadores con %
            if (['DGS10', 'BAMLC0A4CBBB'].includes(code)) {
                return value.toFixed(2) + ' %';
            }

            if (CURRENCY_INDICATORS.includes(code)) {
                // WRESBAL/WTREGEN son agregados enormes -> sin decimales.
                // HYG es un precio de ETF -> 2 decimales.
                const decimals = (code === 'HYG') ? 2 : 0;
                return '$ ' + formatUS(value, decimals);
            }
            return value.toFixed(2);
        }

        function formatValueDetailed(code, value) {
            if (value === null || value === undefined) return 'N/A';

            if (CURRENCY_INDICATORS.includes(code)) {
                return '$ ' + formatUS(value, 2);
            }
            return value.toFixed(2);
        }

        function renderIndicators() {
            const container = document.getElementById('indicatorsContainer');
            container.innerHTML = '';

            for (const [code, data] of Object.entries(currentData)) {
                const statusClass = data.status || 'gray';
                const html = `
                    <div class="indicator-card">
                        <div class="indicator-header">
                            <div class="indicator-name">${data.name}</div>
                            <div class="status-badge ${statusClass}"></div>
                        </div>
                        <div class="current-value">${formatValue(code, data.current)}</div>
                        <div class="last-date">Último: ${data.date}</div>

                        <div class="last-three">
                            <strong>Últimos 3 valores:</strong>
                            ${data.last_three.map(v => `
                                <div class="last-three-item">
                                    <span>${v.date}</span>
                                    <span>${formatValueDetailed(code, v.value)}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="chart-container">
                            <canvas id="chart-${code}"></canvas>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            }

            // Renderizar gráficos
            for (const [code, data] of Object.entries(currentData)) {
                if (data.year_data && data.year_data.length > 0) {
                    renderChart(code, data);
                }
            }
        }

        function renderChart(code, data) {
            const ctx = document.getElementById(`chart-${code}`).getContext('2d');

            if (charts[code]) {
                charts[code].destroy();
            }

            charts[code] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.year_data.map(d => d.date.substring(5)),
                    datasets: [{
                        label: data.name,
                        data: data.year_data.map(d => d.value),
                        borderColor: '#007bff',
                        backgroundColor: 'rgba(0, 123, 255, 0.1)',
                        tension: 0.1,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            grid: {
                                color: '#333'
                            },
                            ticks: {
                                color: '#888'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#888',
                                maxRotation: 45
                            }
                        }
                    }
                }
            });
        }

        async function openThresholds() {
            try {
                const response = await fetch('/api/thresholds', {
                    headers: {
                        'X-Password': password
                    }
                });

                const thresholds = await response.json();
                const form = document.getElementById('thresholdsForm');
                form.innerHTML = '';

                for (const [indicator, values] of Object.entries(thresholds)) {
                    const html = `
                        <div class="threshold-item">
                            <div class="threshold-label">${indicator}</div>
                            <div class="threshold-inputs">
                                <div>
                                    <small>Normal (min)</small>
                                    <input type="number" step="0.01" data-indicator="${indicator}" data-type="normal_min" value="${values.normal[0]}" />
                                </div>
                                <div>
                                    <small>Normal (max)</small>
                                    <input type="number" step="0.01" data-indicator="${indicator}" data-type="normal_max" value="${values.normal[1]}" />
                                </div>
                                <div>
                                    <small>Tensión (min)</small>
                                    <input type="number" step="0.01" data-indicator="${indicator}" data-type="tension_min" value="${values.tension[0]}" />
                                </div>
                                <div>
                                    <small>Tensión (max)</small>
                                    <input type="number" step="0.01" data-indicator="${indicator}" data-type="tension_max" value="${values.tension[1]}" />
                                </div>
                                <div>
                                    <small>Crisis (min)</small>
                                    <input type="number" step="0.01" data-indicator="${indicator}" data-type="crisis_min" value="${values.crisis[0]}" />
                                </div>
                                <div>
                                    <small>Crisis (max)</small>
                                    <input type="number" step="0.01" data-indicator="${indicator}" data-type="crisis_max" value="${values.crisis[1]}" />
                                </div>
                            </div>
                        </div>
                    `;
                    form.innerHTML += html;
                }

                document.getElementById('thresholdsModal').style.display = 'flex';
            } catch (error) {
                alert('Error cargando umbrales: ' + error.message);
            }
        }

        function closeThresholds() {
            document.getElementById('thresholdsModal').style.display = 'none';
        }

        async function saveThresholds() {
            const inputs = document.querySelectorAll('#thresholdsForm input');
            const thresholds = {};

            inputs.forEach(input => {
                const indicator = input.dataset.indicator;
                const type = input.dataset.type;
                const value = parseFloat(input.value);

                if (!thresholds[indicator]) {
                    thresholds[indicator] = { normal: [0, 0], tension: [0, 0], crisis: [0, 0] };
                }

                const [status, minmax] = type.split('_');
                const index = minmax === 'min' ? 0 : 1;
                thresholds[indicator][status][index] = value;
            });

            try {
                const response = await fetch('/api/thresholds', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Password': password
                    },
                    body: JSON.stringify(thresholds)
                });

                if (response.ok) {
                    closeThresholds();
                    fetchData();
                    alert('Umbrales guardados');
                }
            } catch (error) {
                alert('Error guardando umbrales: ' + error.message);
            }
        }

        // Sin contraseña: cargar los datos en cuanto la página esté lista.
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fetchData);
        } else {
            fetchData();
        }
    </script>
</body>
</html>
